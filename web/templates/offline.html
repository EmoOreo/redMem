<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>Offline - Reddit Memory</title>
  <link rel="stylesheet" href="/static/tailwind.css">
</head>
<body>
  <div class="container" style="display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:80vh; text-align:center;">
    <div class="card" style="max-width:480px; padding:2rem;">
      <div style="font-size:3rem; margin-bottom:1rem;">📡</div>
      <h1 style="font-size:1.5rem; font-weight:700; margin-bottom:0.5rem; color:var(--text-primary);">You are Offline</h1>
      <p style="color:var(--text-secondary); font-size:0.95rem; margin-bottom:1.5rem;">
        Reddit Memory app shell is available offline, but the requested page or action requires an active internet connection.
      </p>
      <div style="display:flex; flex-direction:column; gap:0.75rem;">
        <a href="/" class="btn btn-primary" style="text-decoration:none;">
          Return to App & Library
        </a>
        <button onclick="window.location.reload()" class="btn btn-secondary">
          Try Again
        </button>
      </div>
    </div>
  </div>
</body>
</html>
